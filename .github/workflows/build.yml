name: Build Helper Bot
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write project files
        run: |
          mkdir -p proj && cd proj
          cat > build.gradle << 'EOF_0'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }
          version = "1.0.0"
          base { archivesName = "helperbot" }
          repositories {}
          dependencies {
              minecraft "com.mojang:minecraft:1.21.11"
              mappings "net.fabricmc:yarn:1.21.11+build.4:v2"
              modImplementation "net.fabricmc:fabric-loader:0.18.4"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11"
          }
          tasks.withType(JavaCompile).configureEach {
              options.release = 21
              options.encoding = "UTF-8"
          }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") { expand "version": project.version }
          }
          EOF_0
          cat > settings.gradle << 'EOF_1'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'helperbot'
          EOF_1
          cat > gradle.properties << 'EOF_2'
          org.gradle.jvmargs=-Xmx2G
          EOF_2
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json << 'EOF_3'
          {
            "schemaVersion": 1,
            "id": "helperbot",
            "version": "${version}",
            "name": "Helper Bot",
            "description": "A helper bot that follows you, fights, collects items and chats.",
            "environment": "*",
            "entrypoints": { "main": ["helperbot.HelperBot"] },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF_3
          mkdir -p src/main/java/helperbot
          cat > src/main/java/helperbot/HelperBot.java << 'EOF_4'
          package helperbot;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.message.v1.ServerMessageEvents;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.ItemEntity;
          import net.minecraft.entity.SpawnReason;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.entity.passive.IronGolemEntity;
          import net.minecraft.server.command.CommandManager;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.text.Text;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.UUID;

          public class HelperBot implements ModInitializer {

              static String tag(UUID id) {
                  return "helperbot_" + id;
              }

              static List<IronGolemEntity> bots(ServerPlayerEntity p) {
                  String t = tag(p.getUuid());
                  return new ArrayList<>(world(p).getEntitiesByType(EntityType.IRON_GOLEM, g -> g.getCommandTags().contains(t)));
              }

              static ServerWorld world(ServerPlayerEntity p) {
                  return (ServerWorld) p.getEntityWorld();
              }

              static void say(ServerPlayerEntity to, String msg) {
                  world(to).getServer().getPlayerManager().broadcast(Text.literal("\u00a7b<\u0645\u0633\u0627\u0639\u062f>\u00a7r " + msg), false);
              }

              @Override
              public void onInitialize() {
                  // /bot : spawn your helper
                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, environment) ->
                      dispatcher.register(CommandManager.literal("bot").executes(ctx -> {
                          ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                          if (!bots(p).isEmpty()) {
                              p.sendMessage(Text.literal("\u0644\u062f\u064a\u0643 \u0645\u0633\u0627\u0639\u062f \u0628\u0627\u0644\u0641\u0639\u0644!"), false);
                              return 0;
                          }
                          IronGolemEntity g = EntityType.IRON_GOLEM.create(world(p), SpawnReason.COMMAND);                          g.refreshPositionAndAngles(p.getX(), p.getY(), p.getZ(), 0, 0);
                          g.setCustomName(Text.literal("\u0645\u0633\u0627\u0639\u062f"));
                          g.setCustomNameVisible(true);
                          g.setPlayerCreated(true);
                          g.setPersistent();
                          g.addCommandTag(tag(p.getUuid()));
                          world(p).spawnEntity(g);
                          say(p, "\u0645\u0631\u062d\u0628\u0627 " + p.getName().getString() + "! \u0623\u0646\u0627 \u0645\u0633\u0627\u0639\u062f\u0643\u060c \u0623\u062a\u0628\u0639\u0643 \u0648\u0623\u062d\u0645\u064a\u0643 \u0648\u0623\u062c\u0645\u0639 \u0627\u0644\u0623\u063a\u0631\u0627\u0636.");
                          return 1;
                      })));

                  // follow owner + collect items
                  ServerTickEvents.END_WORLD_TICK.register(world -> {
                      if (world.getTime() % 10 != 0) return;
                      for (ServerPlayerEntity p : world.getPlayers()) {
                          for (IronGolemEntity g : bots(p)) {
                              double d = g.squaredDistanceTo(p);
                              if (d > 900) {
                                  g.refreshPositionAndAngles(p.getX(), p.getY(), p.getZ(), 0, 0);
                              } else if (d > 36) {
                                  g.getNavigation().startMovingTo(p, 1.2);
                              }
                              for (ItemEntity item : world.getEntitiesByClass(ItemEntity.class, g.getBoundingBox().expand(4), e -> true)) {
                                  p.giveItemStack(item.getStack().copy());
                                  item.discard();
                              }
                          }
                      }
                  });

                  // chat replies
                  ServerMessageEvents.CHAT_MESSAGE.register((message, sender, params) -> {
                      List<IronGolemEntity> list = bots(sender);
                      if (list.isEmpty()) return;
                      String m = message.getSignedContent().trim().toLowerCase();
                      String name = sender.getName().getString();
                      if (m.contains("\u062a\u0639\u0627\u0644") || m.matches(".*\\bcome\\b.*")) {
                          IronGolemEntity g = list.get(0);
                          g.refreshPositionAndAngles(sender.getX(), sender.getY(), sender.getZ(), 0, 0);
                          say(sender, "\u0623\u0646\u0627 \u0647\u0646\u0627 \u064a\u0627 " + name + "!");
                      } else if (m.contains("\u0645\u0646 \u0623\u0646\u062a") || m.contains("\u0645\u0646 \u0627\u0646\u062a") || m.matches(".*\\bwho are you\\b.*")) {
                          say(sender, "\u0623\u0646\u0627 \u0628\u0648\u062a \u0645\u0633\u0627\u0639\u062f\u060c \u0623\u062a\u0628\u0639\u0643 \u0648\u0623\u062d\u0645\u064a\u0643 \u0648\u0623\u062c\u0645\u0639 \u0627\u0644\u0623\u063a\u0631\u0627\u0636.");
                      } else if (m.contains("\u0634\u0643\u0631\u0627") || m.matches(".*\\bthanks\\b.*")) {
                          say(sender, "\u0639\u0641\u0648\u0627\u064b! \u0647\u0630\u0627 \u0648\u0627\u062c\u0628\u064a.");
                      } else if (m.contains("\u0645\u0631\u062d\u0628\u0627") || m.contains("\u0647\u0644\u0627") || m.contains("\u0627\u0644\u0633\u0644\u0627\u0645") || m.matches(".*\\b(hi|hello)\\b.*")) {
                          say(sender, "\u0645\u0631\u062d\u0628\u0627 " + name + "! \u0642\u0644 \u0644\u064a \u062a\u0639\u0627\u0644 \u0648\u0623\u0646\u0627 \u0623\u0623\u062a\u064a \u0625\u0644\u064a\u0643.");
                      } else {
                          say(sender, "\u0644\u0645 \u0623\u0641\u0647\u0645\u060c \u062c\u0631\u0628: \u062a\u0639\u0627\u0644 \u0623\u0648 \u0645\u0631\u062d\u0628\u0627 \u0623\u0648 \u0645\u0646 \u0623\u0646\u062a.");
                      }
                  });
              }
          }
          EOF_4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        working-directory: proj
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: helperbot-jar
          path: |
            proj/build/libs/*.jar
            !proj/build/libs/*-sources.jar
